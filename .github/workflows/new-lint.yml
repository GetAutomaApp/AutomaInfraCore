name: SwiftLint

on:
  pull_request:
    paths:
      - '**.swift'
  push:
    paths:
      - '**.swift'

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run SwiftLint
        uses: GetAutomaApp/opensource-actions/swiftlint@main
        with:
          extra_args: "--config test-conf.yml"