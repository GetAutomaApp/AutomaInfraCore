name: Code Review with ollama
on:
  pull_request:
    types:
      - opened
      - synchronize

permissions: write-all
jobs:
  code_review:
    runs-on: [macos, self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Ollama
        run: |
          which ollama || brew install ollama
          ollama ls | grep -c codellama || ollama pul codellama
        shell: bash
      - name: Build & Package
        run: |
          cd .github/actions_code/ai-code-review
          npm install
          npm run build
          npm run package
        shell: bash
      - name: Run Codellama Review
        run: |
          node .github/actions_code/ai-code-review/dist/index.js
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_ADDRESS: "http://localhost:11434"
          LLM_MODEL: "codellama"
