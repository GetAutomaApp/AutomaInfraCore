name: Run `AutomaCLI` tests

on:
  push:
    branches-ignore:
      - develop
      - release/staging
      - release/production

jobs:
  run:
    runs-on: [macos-15]

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6"

      - name: Get Cache
        uses: actions/cache@v3
        id: cli-build
        with:
          key: cli-cache-${{ hashFiles('CLI/Package.resolved') }}
          path: CLI/.build

      - name: Install NodeJS Dependencies
        run: |
          npm run prepare:action

      - name: Run Unit / Integration tests for AutomaCLI
        uses: ./.github/actions/swift-test
        with:
          directory: 'CLI'
