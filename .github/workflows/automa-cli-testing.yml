name: Run `AutomaCLI` tests

on:
  pull_request:
    paths:
      - 'CLI/**'

jobs:
  swifttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Cache
        uses: actions/cache@v3
        id: cli-build
        with:
          key: cli-cache-${{ hashFiles('CLI/Package.resolved') }}
          path: CLI/.build
          restore-keys: |
            cli-cache-

      - name: Run SwiftTesting
        uses: GetAutomaApp/opensource-actions/swifttesting@5-implement-standardized-swift-test-action
        with:
          working-directory: './CLI'
          compose: 'false'
