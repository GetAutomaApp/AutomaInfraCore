name: Fly Deploy To Staging

on:
  push:
    branches:
      - release/staging

jobs:
  deploy:
    name: Deploy app
    runs-on: blacksmith-32vcpu-ubuntu-2204
    concurrency: deploy-group-staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Get Cache
        uses: useblacksmith/cache@v5
        id: backend-build
        with:
          key: deploy-cache-${{ hashFiles('Backend/Package.resolved') }}
          path: Backend/.build

      - name: Get CLI Cache
        uses: useblacksmith/cache@v5
        id: cli-build
        with:
          key: deploy-cache-${{ hashFiles('CLI/Package.resolved') }}
          path: CLI/.build

      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          npm run deploy:backend:staging
          npm run deploy:worker:production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_KEY }}
      FLY_METRICS_TOKEN: ${{ secrets.FLY_METRICS_TOKEN }}

