name: 'Code Review using Ollama'
description: 'Perform a code review on code modified using Ollama'
inputs:
  llm-model:
    description: 'Name of the LLM model to use for code review'
    required: true
    default: 'codegemma'
  GITHUB_TOKEN:
    description: 'GitHub token'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Install Ollama
      run: |
        which ollama || brew install ollama
        ollama ls | grep -c ${{ inputs.llm-model }} || ollama pul ${{ inputs.llm-model }}
      shell: bash

    - name: Get modified files
      id: get-modified-files
      uses: tj-actions/changed-files@v43

    - name: Review modified files
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      run: |
        for file in ${{ steps.get-modified-files.outputs.all_changed_files }}; do
          # Read the content of the file
          file_content=$(cat "$file")

          # Ensure the file content is properly escaped for JSON (escape quotes and special characters)
          escaped_content=$(echo "$file_content" | jq -R -s .)

          # Call the Ollama API with the file content
          modified_file_review=$(curl -s http://127.0.0.1:11434/api/generate -d '{
            "model": "${{ inputs.llm-model }}",
            "prompt": "Review the following file:\n\n```\n'"$escaped_content"'\n```",
            "stream": false
          }' | jq -r '.response')

          # Prepare the review comment
          file_comment="Ollama Code Review for \`$file\`:\n\n$modified_file_review"
          echo "$file_comment" >> ollama_review.txt
          echo "$file_comment"
        done

        # Post the review as a comment on the PR
        gh pr comment ${{ github.event.pull_request.number }} --body "$(cat ollama_review.txt)"
      shell: bash
